name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - "data/matches.json"
      - "README.md"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepare web assets into www/
        run: |
          mkdir -p www/data
          cp index.html www/index.html
          cp data/matches.json www/data/matches.json

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add Android platform and sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yellow-card-analyzer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
